# ==============================================================================
# ALACRITTY CONFIGURATION
# ==============================================================================

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

# --- WINDOW SETTINGS ---
[window]
padding = { x = 0, y = 0 }
dynamic_padding = true
opacity = 1
blur = false
decorations = 'none'

# --- FONT CONFIGURATION ---
[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.offset]
x = 0
y = 1

# --- CURSOR ---
[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }

# --- COLOR SCHEME: TOKYO NIGHT ---
[colors.primary]
background = "#252534"
foreground = "#dde1f1"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.cursor]
text   = "#252534"
cursor = "#dde1f1"

[colors.selection]
text   = "#c0caf5"
background = "#33467c"